[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route /api/chat to the Netlify function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback (must come AFTER the /api redirect)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
